<style>
  :root {
    --bg: #0A0A0F;
    --panel: #16151D;
    --panel-2: #1B1A24;
    --bubble-user: #1F1E28;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text: #F2F0F5;
    --muted: #8B899A;
    --danger: #E0607A;
    --grad: linear-gradient(135deg, #7C6CF0 0%, #B15CE0 50%, #ED6FA8 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; flex-shrink: 0;
  }
  .icon-btn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:active { background: #201F29; }
  .header-title {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 8px 6px 14px; border-radius: 20px; font-size: 14.5px; font-weight: 600;
  }
  .beta-pill {
    background: var(--grad); font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 10px; color: white; letter-spacing: 0.3px;
  }
  .header-actions { display: flex; gap: 8px; }

  #chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .msg-row { display: flex; margin-bottom: 16px; gap: 10px; align-items: flex-start; }
  .msg-row.user { justify-content: flex-end; }
  .avatar-orb { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); flex-shrink: 0; margin-top: 2px; }
  .bubble { max-width: 78%; padding: 11px 15px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg-row.user .bubble { background: var(--bubble-user); border-radius: 18px 18px 4px 18px; color: #E7E5EE; }
  .msg-row.assistant .bubble { background: none; padding: 4px 0; color: var(--text); }

  .thinking-dots { display: inline-flex; gap: 4px; padding: 8px 0; }
  .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite ease-in-out; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(16px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0; border-top: 1px solid var(--border-soft);
  }
  #text-input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 13px 18px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; outline: none; }
  #text-input::placeholder { color: var(--muted); }
  .round-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  #plus-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  #mic-btn { background: var(--grad); color: white; }
  #send-btn { background: var(--grad); color: white; display: none; }

  #voice-view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 24px calc(30px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  #voice-view.active { display: flex; }
  #chat-view.hidden { display: none; }
  .transcript { color: var(--muted); font-size: 15px; line-height: 1.6; min-height: 60px; margin-top: 10px; }
  .orb-wrap { display: flex; align-items: center; justify-content: center; flex: 1; }
  .orb { width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9C8CF5, #B15CE0 45%, #6C4FD1 75%, #4A3A9E 100%); box-shadow: 0 0 60px rgba(177,92,224,0.45), 0 0 120px rgba(124,108,240,0.25); animation: breathe 3.2s ease-in-out infinite; }
  .orb.listening { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
